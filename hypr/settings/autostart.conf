# Execute your favorite apps at launch


exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1

exec-once = dbus-update-activation-environment --all
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_STYLE_OVERRIDE QT_QPA_PLATFORMTHEME QT_QUICK_CONTROLS_STYLE
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_STYLE_OVERRIDE QT_QPA_PLATFORMTHEME QT_QUICK_CONTROLS_STYLE

# exec-once =  hyprpm reload && hyprctl reload && hyprctl dismissnotify 
exec-once = hyprpm reload

# exec-once = hyprlock

exec-once = hyprshade on vibrance

exec-once = /home/scelester/.config/hypr/scripts/custom_script_starter 


exec-once = [title;workspace special:f8 silent] sleep 10 && Ferdium &
exec-once = [title;workspace special:f8 silent] sleep 10 && org.ferdium.Ferdium &
# exec-once = [title;workspace special:f9 silent] spotube &


exec-once = copyq &

exec-once = bash /home/scelester/.config/hypr/scripts/mpd_bootstrap.sh

exec-once = /home/scelester/MyScripts/battery_warrning &
exec-once = /home/scelester/.config/hypr/scripts/use_last_widget.sh &
exec-once = hyprctl setcursor Fluentt 27

exec-once = awww-daemon &
exec-once = awww img -o "HDMI-A-1" Pictures/Wallpapers/wallpaper_darker.jpg &
exec-once = awww img /home/scelester/Pictures/Wallpapers/wallhaven-jevqpy_1920x1080.png &

exec-once = sleep 1 && battery_saver_mode &
 	
exec-once = mega-cmd &

