# Gestures (fixed i guess dec -8 2024)
# NOTE: hl.dsp.exec_raw() is a confirmed no-op in this Hyprland build (0.56.2)
# - it returns "ok" but never actually dispatches. Verified live against the
# compositor. Use the typed hl.dsp.* wrappers instead (all confirmed working).
gesture swipe left 3 hyprctl dispatch 'hl.dsp.focus({ workspace = "e+1" })'
gesture swipe right 3 hyprctl dispatch 'hl.dsp.focus({ workspace = "e-1" })'
gesture swipe up 3 hyprctl dispatch 'hl.dsp.window.fullscreen()'
gesture swipe down 3 hyprctl dispatch 'hl.dsp.focus({ workspace = "empty" })'
# left: move window to an empty workspace AND follow it (focus goes with it)
gesture swipe left 4 hyprctl dispatch 'hl.dsp.window.move({ workspace = "empty" })'
# right: send window to an empty workspace silently (stay on current workspace)
gesture swipe right 4 hyprctl dispatch 'hl.dsp.window.move({ workspace = "empty silent" })'
